name: Weekly Model Retrain

on:
  # Run every Sunday at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'
  
  # Allow manual trigger
  workflow_dispatch:

# Grant permission to push changes back to the repo
permissions:
  contents: write

jobs:
  retrain-models:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ai_stock_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Serverless Training Script
        env:
          PYTHONPATH: . 
        run: |
          echo "Starting serverless training..."
          # This script will create/update files in ai_stock_backend/model_cache/
          python -m scripts.pre_train_popular_tickers

      - name: Verify Files
        run: |
          echo "Checking for saved models in model_cache..."
          # List the model_cache directory to verify files exist
          ls -R model_cache/ || echo "No model_cache directory found!"

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          # FIX: We now add the 'model_cache' folder
          # Because we are in 'ai_stock_backend', this points to 'ai_stock_backend/model_cache'
          git add model_cache/
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to trained models. Skipping commit."
          else
            git commit -m "Auto-update trained models [skip ci]"
            git push
          fi