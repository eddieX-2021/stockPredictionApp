name: Weekly Model Retrain

on:
  # Run every Sunday at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'
  
  # Allow manual trigger
  workflow_dispatch:

# Grant permission to push changes back to the repo
permissions:
  contents: write

jobs:
  retrain-models:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ai_stock_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Caches dependencies to speed up future runs

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Force install from the requirements file
          pip install -r requirements.txt

      - name: Run Serverless Training Script
        # We run this as a module (-m) to ensure imports work correctly
        env:
          PYTHONPATH: . 
        run: |
          echo "Starting serverless training..."
          python -m scripts.pre_train_popular_tickers

      - name: Verify Files
        run: |
          echo "Checking for saved models..."
          ls -R app/mlm_predict/saved_models/ || echo "No models directory found!"

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          # Add the saved_models directory
          # Since we are in 'ai_stock_backend' working dir, this path is relative to it
          git add app/mlm_predict/saved_models/
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to trained models. Skipping commit."
          else
            git commit -m "Auto-update trained models [skip ci]"
            git push
          fi